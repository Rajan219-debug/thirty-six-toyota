name: ci

env:
  DO_NOT_TRACK: 1

on:
  pull_request:
  merge_group:
  push:
    tags:
      - v*
    branches:
      - main

concurrency:
  # main merges use a unique run_id so they don't cancel each other
  # other branches or PRs share a group to auto-cancel old runs
  group: ${{ github.ref == 'refs/heads/main' &&
    format('{0}-{1}', github.workflow, github.run_id) ||
    format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    name: Release
    if: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
    uses: ./.github/workflows/release.yml
    needs:
      - test
    secrets: inherit
    # release.yml's generate-swagger-docs/create-release jobs request
    # contents: write; a called job can't escalate beyond what the caller
    # grants, and this repo's default GITHUB_TOKEN permission is read-only
    # — without this, the whole reusable-workflow graph is rejected at
    # validation time (startup_failure, zero jobs), not just those two jobs.
    permissions:
      contents: write
