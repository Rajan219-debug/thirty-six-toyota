name: ci

env:
  DO_NOT_TRACK: 1

on:
  pull_request:
  merge_group:
  push:
    tags:
      - v*
    branches:
      - main

concurrency:
  # main merges use a unique run_id so they don't cancel each other
  # other branches or PRs share a group to auto-cancel old runs
  group: ${{ github.ref == 'refs/heads/main' &&
    format('{0}-{1}', github.workflow, github.run_id) ||
    format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    name: Release
    if: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
    uses: ./.github/workflows/release.yml
    needs:
      - test
    secrets: inherit
    # release.yml's generate-swagger-docs/create-release jobs request
    # contents: write; a called job can't escalate beyond what the caller
    # grants, and this repo's default GITHUB_TOKEN permission is read-only
    # — without this, the whole reusable-workflow graph is rejected at
    # validation time (startup_failure, zero jobs), not just those two jobs.
    permissions:
      contents: write

  deploy:
    name: Deploy
    # Only on a real push to main (not PRs, not tags) — a green PR shouldn't
    # touch production, and a tag push is a release artifact, not a deploy.
    if: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Deploy over SSH
        # Plain openssh-client (preinstalled on the runner) instead of a
        # third-party action — nothing to pin, nothing to trust beyond the
        # runner image itself. Requires three repo secrets to be set
        # (Settings > Secrets and variables > Actions): VPS_HOST, VPS_USER,
        # VPS_SSH_KEY (a private key whose public half is authorized on the
        # VPS for VPS_USER). Optional repo variable VPS_PATH overrides the
        # default deploy path. Until these are set, this step fails loudly
        # rather than silently skipping — a workflow step can't easily
        # detect "secret not configured" up front, so this is deliberate.
        #
        # Host key: set the optional VPS_HOST_KEY secret to the VPS's real
        # `ssh-keyscan -H <host>` output (run once, out-of-band, and confirm
        # the fingerprint against the VPS's own console/provider dashboard)
        # to pin it. Without it, this falls back to trusting whatever host
        # key answers live at deploy time — bare ssh-keyscan is trust-on-
        # first-use with no pinning, so a network-path attacker in the
        # narrow window of a deploy could MITM it. Fine to defer if the VPS
        # doesn't exist yet; set VPS_HOST_KEY once it does.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_PATH: ${{ vars.VPS_PATH || '/opt/vikunja' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          if [ -n "$VPS_HOST_KEY" ]; then
            echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts
          else
            echo "::warning::VPS_HOST_KEY not set — trusting whatever SSH host key the VPS presents live (no pinning). Set VPS_HOST_KEY (output of 'ssh-keyscan -H <host>', verified out-of-band) to close this."
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd $(printf '%q' "$VPS_PATH") && git pull && docker compose up -d --build"
