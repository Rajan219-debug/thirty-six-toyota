name: ci

env:
  DO_NOT_TRACK: 1

on:
  pull_request:
  merge_group:
  push:
    tags:
      - v*
    branches:
      - main

concurrency:
  # main merges use a unique run_id so they don't cancel each other
  # other branches or PRs share a group to auto-cancel old runs
  group: ${{ github.ref == 'refs/heads/main' &&
    format('{0}-{1}', github.workflow, github.run_id) ||
    format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    name: Release
    if: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
    uses: ./.github/workflows/release.yml
    needs:
      - test
    secrets: inherit

  deploy:
    name: Deploy
    # Only on a real push to main (not PRs, not tags) — a green PR shouldn't
    # touch production, and a tag push is a release artifact, not a deploy.
    if: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Deploy over SSH
        # Plain openssh-client (preinstalled on the runner) instead of a
        # third-party action — nothing to pin, nothing to trust beyond the
        # runner image itself. Requires three repo secrets to be set
        # (Settings > Secrets and variables > Actions): VPS_HOST, VPS_USER,
        # VPS_SSH_KEY (a private key whose public half is authorized on the
        # VPS for VPS_USER). Optional repo variable VPS_PATH overrides the
        # default deploy path. Until these are set, this step fails loudly
        # rather than silently skipping — a workflow step can't easily
        # detect "secret not configured" up front, so this is deliberate.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ vars.VPS_PATH || '/opt/vikunja' }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_PATH' && git pull && docker compose up -d --build"
