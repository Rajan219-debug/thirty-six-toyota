name: Test

on:
  workflow_call:

jobs:
  mage:
    runs-on: ubuntu-latest
    name: prepare-mage
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Cache Mage
        id: cache-mage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-build-mage-${{ hashFiles('magefile.go') }}
          path: |
            ./mage-static
      - name: Compile Mage
        if: ${{ steps.cache-mage.outputs.cache-hit != 'true' }}
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: -compile ./mage-static
      - name: Store Mage Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mage_bin
          path: ./mage-static

  api-build:
    runs-on: ubuntu-latest
    needs: mage
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download Mage Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mage_bin
      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@80412be8ce0e77d8afba6b340e34790bc772aa45 # v2.2.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.ghd.outputs.describe }}
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          chmod +x ./mage-static
          ./mage-static build
      - name: Store Vikunja Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vikunja_bin
          path: ./vikunja

  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: prepare frontend files
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  veans-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: veans

  veans-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Install mage
        # The cached mage-static artifact has the parent magefile compiled
        # in — we need a generic mage binary to pick up veans/magefile.go.
        run: go install github.com/magefile/mage@v1.17.2
      - name: Run unit tests
        # `mage test` is the Aliases entry for Test.All which passes
        # `-short` — the e2e package's TestMain skips under -short,
        # mirroring the parent monorepo's pkg/webtests convention. The
        # heavier test-veans-e2e job runs the full suite against the
        # api-build artifact.
        working-directory: veans
        run: mage test

  check-translations:
    runs-on: ubuntu-latest
    needs: mage
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download Mage Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mage_bin
      - name: Check
        run: |
          chmod +x ./mage-static
          ./mage-static check:translations

  test-migration-smoke:
    runs-on: ubuntu-latest
    needs:
      - api-build
    # Postgres only: this fork's docker-compose.yml commits production to
    # Postgres (Row-Level Security/multi-outlet isolation depends on it), so
    # testing upstream's MySQL/MariaDB/SQLite support here tested a
    # portability guarantee nothing actually relies on.
    services:
      migration-smoke-db-postgres:
        image: postgres:18@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
        env:
          POSTGRES_PASSWORD: vikunjatest
          POSTGRES_DB: vikunjatest
        ports:
          - 5432:5432
    steps:
      - name: Download Unstable
        run: |
          wget https://dl.vikunja.io/vikunja/unstable/vikunja-unstable-linux-amd64-full.zip -q -O vikunja-latest.zip
          unzip vikunja-latest.zip vikunja-unstable-linux-amd64
      - name: Download Vikunja Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vikunja_bin
      - name: run migration
        env:
          VIKUNJA_DATABASE_TYPE: postgres
          VIKUNJA_DATABASE_USER: postgres
          VIKUNJA_DATABASE_PASSWORD: vikunjatest
          VIKUNJA_DATABASE_DATABASE: vikunjatest
          VIKUNJA_DATABASE_SSLMODE: disable
          VIKUNJA_LOG_DATABASE: stdout
          VIKUNJA_LOG_DATABASELEVEL: debug
          VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:3456
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          until PGPASSWORD=vikunjatest psql -h 127.0.0.1 -U postgres -d vikunjatest -c "SELECT 1" &> /dev/null; do
            echo "PostgreSQL not ready yet, waiting 2 seconds..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

          ./vikunja-unstable-linux-amd64 migrate
          # Run the migrations from the binary built in the step before
          chmod +x vikunja
          ./vikunja migrate

  test-api:
    runs-on: ubuntu-latest
    needs:
      - mage
    # Postgres only: this fork's docker-compose.yml commits production to
    # Postgres (Row-Level Security/multi-outlet isolation depends on it), so
    # testing upstream's SQLite/MySQL/MariaDB/ParadeDB support here tested a
    # portability guarantee nothing actually relies on.
    strategy:
      matrix:
        test:
          - feature
          - web
    services:
      db-postgres:
        image: postgres:18@sha256:073e7c8b84e2197f94c8083634640ab37105effe1bc853ca4d5fbece3219b0e8
        env:
          POSTGRES_PASSWORD: vikunjatest
          POSTGRES_DB: vikunjatest
        ports:
          - 5432:5432
      test-ldap:
        image: gitea/test-openldap@sha256:b66527e298d6062d5289dc411d1b8da1c593f8140a3d1f863e8d9d021234122f
        ports:
          - 389:389
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download Mage Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mage_bin
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Configure Postgres for faster tests
        run: |
          # Connect to Postgres and disable fsync, full_page_writes, and synchronous_commit for faster tests
          PGPASSWORD=vikunjatest psql -h localhost -U postgres -d vikunjatest -c "ALTER SYSTEM SET fsync = off;"
          PGPASSWORD=vikunjatest psql -h localhost -U postgres -d vikunjatest -c "ALTER SYSTEM SET full_page_writes = off;"
          PGPASSWORD=vikunjatest psql -h localhost -U postgres -d vikunjatest -c "ALTER SYSTEM SET synchronous_commit = off;"
          # Reload the configuration
          PGPASSWORD=vikunjatest psql -h localhost -U postgres -d vikunjatest -c "SELECT pg_reload_conf();"
      - name: test
        env:
          VIKUNJA_TESTS_USE_CONFIG: 1
          VIKUNJA_DATABASE_TYPE: postgres
          VIKUNJA_DATABASE_USER: postgres
          VIKUNJA_DATABASE_PASSWORD: vikunjatest
          VIKUNJA_DATABASE_DATABASE: vikunjatest
          VIKUNJA_DATABASE_SSLMODE: disable
          VIKUNJA_DATABASE_HOST: localhost
          VIKUNJA_AUTH_LDAP_ENABLED: 1
          VIKUNJA_AUTH_LDAP_HOST: localhost
          VIKUNJA_AUTH_LDAP_USETLS: 0
          VIKUNJA_AUTH_LDAP_BASEDN: dc=planetexpress,dc=com
          VIKUNJA_AUTH_LDAP_BINDDN: uid=gitea,ou=service,dc=planetexpress,dc=com
          VIKUNJA_AUTH_LDAP_BINDPASSWORD: password
          VIKUNJA_AUTH_LDAP_USERFILTER: "(&(objectclass=inetorgperson)(uid=%s))"
          VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:3456
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          chmod +x mage-static
          ./mage-static test:${{ matrix.test }}

  test-caldav:
    runs-on: ubuntu-latest
    needs:
      - mage
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download Mage Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mage_bin
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: test
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          chmod +x mage-static
          ./mage-static test:caldav

  test-e2e-api:
    runs-on: ubuntu-latest
    needs:
      - mage
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download Mage Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mage_bin
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: test
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          chmod +x mage-static
          ./mage-static test:e2e-api

  # Row-Level Security (multi-outlet isolation) can only be exercised by
  # actually booting the server: SetupTests() (used by every other job here)
  # syncs the schema straight from Go structs and never runs
  # db.EnsureTenantColumns()/db.ArmTenantRLS(), which only run from the real
  # boot path (pkg/initialize/init.go). So instead of `mage test:X`, this
  # builds the real binary, boots it against Postgres as a non-superuser role
  # (RLS is silently bypassed by superusers — see db.ArmTenantRLS's own
  # fail-closed check) with enforcement on, then drives
  # pkg/e2etests/tenant_isolation_test.go against it over HTTP, same as every
  # other job's normal test run would against an in-process handler.
  #
  # NOTE: this job has not been exercised in a real CI run yet — verify it
  # goes green before relying on it as a merge gate.
  #
  # continue-on-error: this job's steps have not run in real CI before,
  # unlike every other job here — a mistake in the YAML itself (not the app)
  # could otherwise block every merge/deploy behind an untested test job.
  # Remove continue-on-error once it's gone green a few times for real.
  test-tenant-isolation:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - mage
    services:
      db-postgres:
        image: postgres:18@sha256:073e7c8b84e2197f94c8083634640ab37105effe1bc853ca4d5fbece3219b0e8
        env:
          POSTGRES_PASSWORD: vikunjatest
          POSTGRES_DB: vikunjatest
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download Mage Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mage_bin
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Create the non-superuser app role RLS depends on
        # Mirrors docker/postgres-init/10-vikunja-app-role.sh: the app must
        # NOT connect as the stock (superuser) POSTGRES_USER, or RLS is
        # silently bypassed and this whole job would pass while testing
        # nothing.
        run: |
          PGPASSWORD=vikunjatest psql -h localhost -U postgres -d vikunjatest -c \
            "CREATE ROLE vikunja_app LOGIN PASSWORD 'vikunjatest_app'; GRANT CONNECT ON DATABASE vikunjatest TO vikunja_app; GRANT USAGE, CREATE ON SCHEMA public TO vikunja_app;"
      - name: Build the server binary
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          chmod +x mage-static
          ./mage-static build:build
      - name: Boot the server as vikunja_app with RLS enforced
        env:
          VIKUNJA_DATABASE_TYPE: postgres
          VIKUNJA_DATABASE_HOST: localhost:5432
          VIKUNJA_DATABASE_USER: vikunja_app
          VIKUNJA_DATABASE_PASSWORD: vikunjatest_app
          VIKUNJA_DATABASE_DATABASE: vikunjatest
          VIKUNJA_DATABASE_SSLMODE: disable
          VIKUNJA_SERVICE_ROOTPATH: ${{ github.workspace }}
          VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:3469/
          VIKUNJA_SERVICE_INTERFACE: ":3469"
          VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
          VIKUNJA_SERVICE_SECRET: ci-tenant-isolation-test-secret
          VIKUNJA_MULTITENANCY_ENFORCE: "1"
        run: |
          nohup ./vikunja web > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3469/api/v1/info || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3469/api/v1/info || { echo "server did not come up"; cat server.log; exit 1; }
      - name: Seed an HQ admin user and two outlets
        # No fixtures on a fresh DB, and there's no API to grant is_admin/
        # is_hq — set them directly, same as the manual verification pass
        # this test was modeled on.
        run: |
          curl -sf -X POST http://127.0.0.1:3469/api/v1/register -H "Content-Type: application/json" \
            -d '{"username":"ci_hq_admin","email":"ci_hq_admin@example.com","password":"CiTestPassword123!"}'
          PGPASSWORD=vikunjatest psql -h localhost -U postgres -d vikunjatest -c \
            "UPDATE users SET is_admin = true, is_hq = true WHERE username = 'ci_hq_admin';
             INSERT INTO tenants (name, slug, created, updated) VALUES ('CI Outlet A','ci-outlet-a',now(),now()), ('CI Outlet B','ci-outlet-b',now(),now());"
      - name: Run the isolation test
        env:
          VIKUNJA_E2E_TENANT_ISOLATION_URL: http://127.0.0.1:3469
          VIKUNJA_E2E_TENANT_ISOLATION_ADMIN_USER: ci_hq_admin
          VIKUNJA_E2E_TENANT_ISOLATION_ADMIN_PASS: CiTestPassword123!
          VIKUNJA_E2E_TENANT_ISOLATION_TENANT_A: 2
          VIKUNJA_E2E_TENANT_ISOLATION_TENANT_B: 3
        run: go test -run TestTenantIsolation -v ./pkg/e2etests/...
      - name: Server log
        if: always()
        run: cat server.log || true

  # Boots a real instance (SQLite, no Postgres needed — this isn't testing
  # RLS) and runs frontend/scripts/a11y-scan.cjs (axe-core over Playwright)
  # against it. Fails the job on any violation.
  #
  # NOTE: not exercised in a real CI run yet — verify it goes green before
  # relying on it as a merge gate (continue-on-error, same reasoning as
  # test-tenant-isolation above).
  test-accessibility:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - mage
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend
        with:
          install-e2e-binaries: 'true'
      - name: Install Playwright's browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Download Mage Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mage_bin
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Build the server binary (embeds the frontend build above)
        run: |
          chmod +x mage-static
          ./mage-static build:build
      - name: Boot the server
        env:
          VIKUNJA_SERVICE_ROOTPATH: ${{ github.workspace }}
          VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:3470/
          VIKUNJA_SERVICE_INTERFACE: ":3470"
          VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
          VIKUNJA_SERVICE_SECRET: ci-a11y-scan-test-secret
        run: |
          nohup ./vikunja web > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3470/api/v1/info || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3470/api/v1/info || { echo "server did not come up"; cat server.log; exit 1; }
      - name: Seed the scan's login user
        # Default (empty) SQLite DB has no fixtures — register the user the
        # script logs in as (VIKUNJA_A11Y_SCAN_USER/PASS, boss/testpass123
        # by default). Not is_admin, so /admin/* pages will show their
        # non-admin state rather than the real admin UI — acceptable for a
        # structural/contrast smoke scan, not worth seeding a full fixture set for.
        run: |
          curl -sf -X POST http://127.0.0.1:3470/api/v1/register -H "Content-Type: application/json" \
            -d '{"username":"boss","email":"boss@example.com","password":"testpass123"}'
      - name: Run the accessibility scan
        working-directory: frontend
        run: node scripts/a11y-scan.cjs http://127.0.0.1:3470
      - name: Server log
        if: always()
        run: cat server.log || true

  test-s3-integration:
    runs-on: ubuntu-latest
    needs:
      - mage
    services:
      test-minio:
        image: bitnamilegacy/minio:latest@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: vikunja
          MINIO_ROOT_PASSWORD: vikunjatest
          MINIO_DEFAULT_BUCKETS: vikunja-test
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download Mage Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mage_bin
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: test S3 file storage integration
        env:
          VIKUNJA_TESTS_USE_CONFIG: 1
          VIKUNJA_DATABASE_TYPE: sqlite
          VIKUNJA_FILES_TYPE: s3
          VIKUNJA_FILES_S3_ENDPOINT: http://localhost:9000
          VIKUNJA_FILES_S3_BUCKET: vikunja-test
          VIKUNJA_FILES_S3_REGION: us-east-1
          VIKUNJA_FILES_S3_ACCESSKEY: vikunja
          VIKUNJA_FILES_S3_SECRETKEY: vikunjatest
          VIKUNJA_FILES_S3_USEPATHSTYLE: true
          VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:3456
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          chmod +x mage-static
          # Run only the S3 file storage integration tests
          ./mage-static test:filter "TestFileStorageIntegration"

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend
      - name: Lint
        working-directory: frontend
        run: pnpm lint

  frontend-license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend
      - name: List dependency licenses
        # Informational, not a hard gate (continue-on-error, same as
        # frontend-typecheck below) — flagging a new GPL/AGPL-family
        # dependency is a decision for a human, not something to silently
        # fail the build on. No GPL/AGPL/LGPL entries as of 2026-07-19.
        continue-on-error: true
        working-directory: frontend
        run: |
          pnpm licenses list --json > /tmp/licenses.json
          if grep -iE '"(A?GPL|LGPL)' /tmp/licenses.json; then
            echo "::warning::A GPL/AGPL/LGPL-family license appeared in the dependency tree — review before merging."
          fi
          pnpm licenses list

  frontend-stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend
      - name: Lint styles
        working-directory: frontend
        run: pnpm lint:styles

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend
      - name: Typecheck
        continue-on-error: true
        working-directory: frontend
        run: pnpm typecheck

  test-frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend
      - name: Run unit tests
        working-directory: frontend
        run: pnpm test:unit

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend
      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@80412be8ce0e77d8afba6b340e34790bc772aa45 # v2.2.0
      - name: Inject frontend version
        working-directory: frontend
        run: |
          echo "{\"VERSION\": \"${{ steps.ghd.outputs.describe }}\"}" > src/version.json
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Store Frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend_dist
          path: ./frontend/dist

  test-veans-e2e:
    runs-on: ubuntu-latest
    needs:
      - api-build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download Vikunja Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vikunja_bin
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Install mage
        # The cached mage-static artifact has the parent magefile compiled
        # in — we need a generic mage binary to pick up veans/magefile.go.
        run: go install github.com/magefile/mage@v1.17.2
      - run: chmod +x ./vikunja
      - name: Run veans e2e against ephemeral Vikunja
        env:
          VIKUNJA_SERVICE_INTERFACE: ":3456"
          VIKUNJA_SERVICE_PUBLICURL: "http://127.0.0.1:3456/"
          VIKUNJA_SERVICE_JWTSECRET: "veans-e2e-jwt-secret-do-not-use-in-production"
          # Enables PATCH /api/v1/test/{table} — the e2e suite seeds its
          # own admin via this endpoint (see veans/e2e/helpers.go), same
          # mechanism the playwright suite uses.
          VIKUNJA_SERVICE_TESTINGTOKEN: averyLongSecretToSe33dtheDB
          VIKUNJA_DATABASE_TYPE: sqlite
          VIKUNJA_DATABASE_PATH: memory
          VIKUNJA_LOG_LEVEL: WARNING
          VIKUNJA_MAILER_ENABLED: "false"
          VIKUNJA_REDIS_ENABLED: "false"
          VIKUNJA_RATELIMIT_NOAUTHLIMIT: "1000"
          VEANS_E2E_API_URL: http://127.0.0.1:3456
          # Same value as VIKUNJA_SERVICE_TESTINGTOKEN above — pass-through
          # so the test harness can authenticate against /api/v1/test/.
          VEANS_E2E_TESTING_TOKEN: averyLongSecretToSe33dtheDB
        run: |
          set -e
          # Boot the prebuilt API and tests in one shell — backgrounded
          # processes don't survive step boundaries on GH runners.
          nohup ./vikunja web > /tmp/vikunja.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3456/api/v1/info >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:3456/api/v1/info >/dev/null; then
            echo "::error::API failed to start; log:"
            cat /tmp/vikunja.log
            exit 1
          fi
          # `mage test:e2e` builds the binary once and exports VEANS_BINARY
          # so each subtest reuses it (plain `mage test` would rebuild per
          # test via buildOrLocate()). The suite seeds its own admin
          # internally — no curl seeding here.
          (cd veans && mage test:e2e)
      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veans-e2e-vikunja-log
          path: /tmp/vikunja.log
          retention-days: 7

  # A Playwright e2e job previously lived here. Removed: frontend/tests/e2e
  # doesn't exist in this repo (never migrated from wherever the data-cy
  # selectors originally came from — see frontend/src/directives/testid.ts),
  # so `playwright test --shard=N/6` matched zero files every run. Verified
  # locally: --list correctly errors "No tests found" on an empty suite, but
  # a sharded run silently exits 0 — every shard reported green for a suite
  # that never ran once. A missing job is honest; that was not. Re-add once
  # real specs exist (see plans/thirtysixtoyota-multitenancy.md-adjacent
  # launch-plan notes for the suggested first flows: login, then the
  # overdue-closure approval workflow).
