name: Bug Report
description: Found something you weren't expecting? Report it here!
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        NOTE: If your issue is a security concern, send it directly to whoever administers this deployment instead of opening a public issue.
  - type: markdown
    attributes:
      value: |
        Please fill out this issue template to report a bug.

        1. Take a moment to check that your issue hasn't been reported before.
        2. Please give all relevant information below, because incomplete
           details will be handled as an invalid report and closed.
  - type: checkboxes
    id: searched
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched for existing open or closed issue reports with the same problem.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Please provide a description of your issue here, with a URL if you were able to reproduce the issue (see below).
  - type: input
    id: version
    attributes:
      label: Vikunja Version
      description: Vikunja version (or commit reference) of your instance
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser and version
      description: If your issue is related to a frontend problem, please provide the browser and version you used to reproduce it.
  - type: dropdown
    id: can-reproduce
    attributes:
      label: Can you reproduce the bug on the Vikunja demo site?
      options:
        - "Please select"
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If this issue involves the Web Interface, please provide one or more screenshots
