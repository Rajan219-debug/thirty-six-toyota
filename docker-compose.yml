# Thirty Six Toyota — reproducible production stack.
#   docker compose up -d --build
# Builds the branded image from ./Dockerfile and runs it against Postgres.
# Override the defaults below via a .env file or the shell before deploying.

services:
  vikunja:
    build:
      context: .
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-dev}
    image: thirtysixtoyota/vikunja:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: db
      # Connect as the NON-SUPERUSER app role (created by the db init script).
      # A superuser would bypass Row-Level Security, defeating outlet isolation.
      VIKUNJA_DATABASE_USER: vikunja_app
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_APP_DB_PASSWORD:-vikunja_app}
      VIKUNJA_DATABASE_DATABASE: vikunja
      # Multi-outlet isolation. Off by default (app behaves single-outlet). Set to
      # 1 only once every request path binds a tenant — see the multitenancy plan.
      VIKUNJA_MULTITENANCY_ENFORCE: ${VIKUNJA_MULTITENANCY_ENFORCE:-0}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET:-change-me-in-production}
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_PUBLIC_URL:-http://localhost:3456/}
      VIKUNJA_SERVICE_FRONTENDURL: ${VIKUNJA_PUBLIC_URL:-http://localhost:3456/}
      # Email. Task-assignment, reminders and closure notifications are e-mailed
      # to staff once this is on. Off by default — set VIKUNJA_MAILER_ENABLED=true
      # and the host/username/password (Gmail, SendGrid, or the dealership SMTP)
      # in your .env to switch it on. The assignee gets "You have been assigned
      # to <task>" the moment a task is assigned to them.
      VIKUNJA_MAILER_ENABLED: ${VIKUNJA_MAILER_ENABLED:-false}
      VIKUNJA_MAILER_HOST: ${VIKUNJA_MAILER_HOST:-}
      VIKUNJA_MAILER_PORT: ${VIKUNJA_MAILER_PORT:-587}
      VIKUNJA_MAILER_USERNAME: ${VIKUNJA_MAILER_USERNAME:-}
      VIKUNJA_MAILER_PASSWORD: ${VIKUNJA_MAILER_PASSWORD:-}
      VIKUNJA_MAILER_FROMEMAIL: ${VIKUNJA_MAILER_FROMEMAIL:-noreply@thirtysixtoyota.com}
    ports:
      - "${VIKUNJA_PORT:-3456}:3456"
    volumes:
      - vikunja-files:/app/vikunja/files
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: ${VIKUNJA_DB_PASSWORD:-vikunja}
      POSTGRES_DB: vikunja
      # Password for the non-superuser app role created by the init script.
      VIKUNJA_APP_DB_PASSWORD: ${VIKUNJA_APP_DB_PASSWORD:-vikunja_app}
    volumes:
      - vikunja-db:/var/lib/postgresql/data
      # Runs once on first init: creates the non-superuser vikunja_app role.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikunja -d vikunja"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  vikunja-db:
  vikunja-files:
